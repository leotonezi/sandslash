<!DOCTYPE html>
<html>
<head>
  <title>@graph Mixed Types JSON-LD</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Product"
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": []
      },
      {
        "@type": "FAQPage"
      }
    ]
  }
  </script>
</head>
<body>
  <h1>Page with @graph containing Product, BreadcrumbList, and FAQPage</h1>
</body>
</html>
